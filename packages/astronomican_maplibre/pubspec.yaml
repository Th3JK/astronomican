name: astronomican_maplibre
description: >-
  GeoMap for astronomican: MapLibre base maps from online styles, raster tiles
  or versioned offline .mbtiles packs, with georeferenced image overlays,
  indoor floors and offline regions.
version: 0.3.0
# Linked to its siblings by path while the family is developed together; swap
# the path dependencies for versions and drop this line to publish.
publish_to: none
repository: https://github.com/sramekj/astronomican
issue_tracker: https://github.com/sramekj/astronomican/issues

topics:
  - maps
  - maplibre
  - offline-maps
  - indoor

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  # Markers, levels, georeferences, the pack installer — everything GeoMap
  # draws or reads that is not MapLibre itself. Re-exported.
  astronomican:
    path: ../astronomican
  flutter:
    sdk: flutter
  # The native renderer behind GeoMap and the offline regions API. 0.27 rather
  # than 0.26: it fixes Android maps staying blank after activity recreation and
  # icons from addImage being dropped, both of which GeoMap would hit.
  maplibre_gl: ^0.27.0
  # For @immutable and @internal.
  meta: ^1.16.0

dev_dependencies:
  # Drives the follower's timers in tests without waiting on a clock.
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  path: ^1.9.1
