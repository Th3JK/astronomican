name: astronomican_location
description: >-
  The visitor's position for astronomican maps: GPS through geolocator and a
  true-north compass through compassx, delivered as a LocationFeed that the
  image maps and GeoMap draw and follow.
version: 0.1.0
# Linked to its siblings by path while the family is developed together; swap
# the path dependencies for versions and drop this line to publish.
publish_to: none
repository: https://github.com/sramekj/astronomican
issue_tracker: https://github.com/sramekj/astronomican/issues

topics:
  - maps
  - location
  - compass

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  # LocationFeed, LocationFix and LocationAccess, which this fills in.
  astronomican:
    path: ../astronomican
  # Heading relative to true north on both platforms: CLHeading on iOS, the
  # rotation vector corrected by Android's own magnetic model on Android.
  # Magnetic north is several degrees off true north in central Europe, which
  # a map turned to the visitor's heading would show.
  compassx: ^1.0.1
  flutter:
    sdk: flutter
  # The GPS, and the permission and service checks, as every app of the family
  # already uses it.
  geolocator: ^14.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
